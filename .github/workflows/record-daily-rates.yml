# Records today's live petrol/diesel prices into data/pak-commodities.json
# so the Daily Rates charts build a real history. Uses the repository's
# built-in GITHUB_TOKEN — nothing to configure. The commit redeploys the
# site on Vercel.
name: Record daily rates

on:
  schedule:
    - cron: '30 17 * * *'   # 22:30 Karachi time, daily
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: record-daily-rates
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record live rates
        run: node scripts/record-daily-rates.js

      - name: Commit if changed
        run: |
          if git diff --quiet data/pak-commodities.json; then
            echo "No change today."
            exit 0
          fi
          git config user.name "liverates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pak-commodities.json
          git commit -m "Daily rates: $(TZ=Asia/Karachi date +%F)"
          git push
